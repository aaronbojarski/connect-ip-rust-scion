name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Install Protoc
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler

      - name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable

      - name: Cache Cargo registry
        uses: actions/cache@v3
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-

      - name: Cache Cargo index
        uses: actions/cache@v3
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-index-

      - name: Cache build artifacts
        uses: actions/cache@v3
        with:
          path: target
          key: ${{ runner.os }}-cargo-build-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-build-

      - name: Run unit tests
        run: cargo test --verbose

      - name: Build binaries
        run: cargo build --verbose

      - name: Upload binaries
        uses: actions/upload-artifact@v3
        with:
          name: binaries
          path: |
            target/debug/connect-ip-rust-scion
          retention-days: 1

  integration-test:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v3

      - name: Download binaries
        uses: actions/download-artifact@v3
        with:
          name: binaries
          path: target/debug

      - name: Make binaries executable
        run: chmod +x target/debug/connect-ip-rust-scion

      - name: Generate self-signed certificate
        run: bash ./testnet/generate_certs.sh

      - name: Set up test network
        run: sudo bash ./testnet/ip/testnet.sh up

      - name: Enable IP forwarding
        run: |
          sudo ip netns exec client_ns sysctl -w net.ipv4.ip_forward=1
          sudo ip netns exec proxy_ns sysctl -w net.ipv4.ip_forward=1

      - name: Start proxy in background
        run: |
          sudo ip netns exec proxy_ns ./target/debug/connect-ip-rust-scion proxy \
            --listen [0-0,10.248.100.11]:4433 \
            --routes 10.248.2.0/24 \
            --address-pool 10.248.2.128/25 \
            --log info > proxy.log 2>&1 &
          echo $! > proxy.pid
          sleep 2

      - name: Start client in background
        run: |
          sudo ip netns exec client_ns ./target/debug/connect-ip-rust-scion client \
            [0-0,10.248.100.11]:4433 \
            --host localhost \
            --routes 10.248.1.0/24 \
            --address-pool 10.248.1.128/25 \
            --log info > client.log 2>&1 &
          echo $! > client.pid
          sleep 5

      - name: Wait for tunnel establishment
        run: |
          echo "Waiting for tunnel to be established..."
          for i in {1..30}; do
            if sudo ip netns exec client_ns ip addr show tun0 2>/dev/null | grep -q "inet "; then
              echo "Tunnel established!"
              sudo ip netns exec client_ns ip addr show tun0
              break
            fi
            if [ $i -eq 30 ]; then
              echo "Timeout waiting for tunnel"
              exit 1
            fi
            sleep 1
          done

      - name: Test connectivity - ping from client to server network
        run: |
          echo "Testing ping from client to server network (10.248.2.1)..."
          sudo ip netns exec client_ns ping -c 5 -W 2 -I tun0 10.248.2.1

      - name: Test connectivity - ping between endhosts
        run: |
          echo "Testing ping between endhosts (eh0 -> eh1)..."
          sudo ip netns exec eh0ns ping -c 5 -W 2 10.248.2.1

      - name: Show proxy logs on failure
        if: failure()
        run: |
          echo "=== Proxy Logs ==="
          cat proxy.log || echo "No proxy logs available"
          echo ""
          echo "=== Client Logs ==="
          cat client.log || echo "No client logs available"
          echo ""
          echo "=== Network Status ==="
          echo "Client namespace:"
          sudo ip netns exec client_ns ip addr || true
          sudo ip netns exec client_ns ip route || true
          echo ""
          echo "Proxy namespace:"
          sudo ip netns exec proxy_ns ip addr || true
          sudo ip netns exec proxy_ns ip route || true

      - name: Clean up
        if: always()
        run: |
          # Kill proxy and client processes
          if [ -f proxy.pid ]; then
            sudo kill $(cat proxy.pid) 2>/dev/null || true
          fi
          if [ -f client.pid ]; then
            sudo kill $(cat client.pid) 2>/dev/null || true
          fi

          # Tear down test network
          sudo bash ./testnet/ip/testnet.sh down || true

          # Clean up any remaining processes
          sudo pkill -f "target/debug/proxy" || true
          sudo pkill -f "target/debug/client" || true

  scion-integration-test:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v3

      - name: Download binaries
        uses: actions/download-artifact@v3
        with:
          name: binaries
          path: target/debug

      - name: Make binaries executable
        run: chmod +x target/debug/connect-ip-rust-scion

      - name: Install Protoc
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler

      - name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable

      - name: Build pocket runtime
        run: |
          cd testnet/scion
          cargo build
          cd ../..

      - name: Generate self-signed certificate
        run: bash ./testnet/generate_certs.sh

      - name: Set up SCION test network
        run: sudo bash ./testnet/scion/testnet.sh up

      - name: Start pocket runtime in background
        run: |
          sudo ip netns exec pocketscion_ns ./testnet/scion/target/debug/scion_testnet > pocket.log 2>&1 &
          echo $! > pocket.pid
          sleep 5

      - name: Enable IP forwarding
        run: |
          sudo ip netns exec client_ns sysctl -w net.ipv4.ip_forward=1
          sudo ip netns exec proxy_ns sysctl -w net.ipv4.ip_forward=1

      - name: Start proxy in background
        run: |
          sudo ip netns exec proxy_ns ./target/debug/connect-ip-rust-scion proxy \
            --listen [2-2,10.1.0.2]:4433 \
            --routes 10.248.2.0/24 \
            --address-pool 10.248.2.128/25 \
            --endhost-api http://10.248.101.21:10001 \
            --snap-token ./testnet/scion/snap.dummytoken \
            --log info > proxy.log 2>&1 &
          echo $! > proxy.pid
          sleep 2

      - name: Wait for SNAP address assignment
        run: |
          echo "Waiting for SNAP to assign 10.1.0.2 to proxy..."
          for i in {1..30}; do
            if sudo ip netns exec proxy_ns ip addr show | grep -q "10.1.0.2"; then
              echo "SNAP address assigned!"
              sudo ip netns exec proxy_ns ip addr
              break
            fi
            if [ $i -eq 30 ]; then
              echo "Timeout waiting for SNAP address assignment"
              exit 1
            fi
            sleep 1
          done

      - name: Start client in background
        run: |
          sudo ip netns exec client_ns ./target/debug/connect-ip-rust-scion client \
            [2-2,10.1.0.2]:4433 \
            --host localhost \
            --routes 10.248.1.0/24 \
            --address-pool 10.248.1.128/25 \
            --endhost-api http://10.248.100.20:10003 \
            --snap-token ./testnet/scion/snap.dummytoken \
            --log info > client.log 2>&1 &
          echo $! > client.pid
          sleep 5

      - name: Wait for tunnel establishment
        run: |
          echo "Waiting for tunnel to be established..."
          for i in {1..30}; do
            if sudo ip netns exec client_ns ip addr show tun0 2>/dev/null | grep -q "inet "; then
              echo "Tunnel established!"
              sudo ip netns exec client_ns ip addr show tun0
              break
            fi
            if [ $i -eq 30 ]; then
              echo "Timeout waiting for tunnel"
              exit 1
            fi
            sleep 1
          done

      - name: Test connectivity - ping from client to server network
        run: |
          echo "Testing ping from client to server network (10.248.2.1)..."
          sudo ip netns exec client_ns ping -c 5 -W 2 -I tun0 10.248.2.1

      - name: Test connectivity - ping between endhosts
        run: |
          echo "Testing ping between endhosts (eh0 -> eh1)..."
          sudo ip netns exec eh0ns ping -c 5 -W 2 10.248.2.1
          echo "Testing ping between endhosts (eh1 -> eh0)..."
          sudo ip netns exec eh1ns ping -c 5 -W 2 10.248.1.1

      - name: Show logs on failure
        if: failure()
        run: |
          echo "=== Pocket Runtime Logs ==="
          cat pocket.log || echo "No pocket logs available"
          echo ""
          echo "=== Proxy Logs ==="
          cat proxy.log || echo "No proxy logs available"
          echo ""
          echo "=== Client Logs ==="
          cat client.log || echo "No client logs available"
          echo ""
          echo "=== Network Status ==="
          echo "Client namespace:"
          sudo ip netns exec client_ns ip addr || true
          sudo ip netns exec client_ns ip route || true
          echo ""
          echo "Proxy namespace:"
          sudo ip netns exec proxy_ns ip addr || true
          sudo ip netns exec proxy_ns ip route || true
          echo ""
          echo "Pocket namespace:"
          sudo ip netns exec pocketscion_ns ip addr || true
          sudo ip netns exec pocketscion_ns ip route || true

      - name: Clean up
        if: always()
        run: |
          # Kill pocket runtime, proxy and client processes
          if [ -f pocket.pid ]; then
            sudo kill $(cat pocket.pid) 2>/dev/null || true
          fi
          if [ -f proxy.pid ]; then
            sudo kill $(cat proxy.pid) 2>/dev/null || true
          fi
          if [ -f client.pid ]; then
            sudo kill $(cat client.pid) 2>/dev/null || true
          fi

          # Tear down test network
          sudo bash ./testnet/scion/testnet.sh down || true

          # Clean up any remaining processes
          sudo pkill -f "scion_testnet" || true
          sudo pkill -f "target/debug/proxy" || true
          sudo pkill -f "target/debug/client" || true
