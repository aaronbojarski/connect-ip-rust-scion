[package]
name = "connect-ip-rust-scion"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.102"
clap = { version = "4", features = ["derive"] }
ipnet = { version = "2.12.0", features = ["serde"] }
metrics = "0.24.3"
metrics-exporter-prometheus = "0.18.1"
octets = "0.3.5"
pnet = "0.35.0"
quiche = "0.26.1"
ring = "0.17.14"
rustls = { version = "0.23.37", default-features = false, features = ["std", "ring"] }
scion-proto = "0.4.0"
scion-stack = "0.4.0"
serde = "1.0.228"
serde_json = "1.0.149"
thiserror = "2.0.18"
tokio = { version = "1.50.0", features = ["full"] }
tokio-util = "0.7.18"
tracing = "0.1.44"
tracing-futures = "0.2.5"
tracing-subscriber = { version = "0.3.22", default-features = false, features = ["env-filter", "fmt", "ansi", "time", "local-time"] }
tun-rs = { version = "2", features = ["async"] }
url = "2.5.8"
x509-parser = "0.18.1"
